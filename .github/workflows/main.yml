name: Build Geode Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        with:
          path: minimal
          sdk: v5.11.2
      - uses: actions/upload-artifact@v4
        with:
          name: fps-boost-mod
          path: minimal/build/*.geode
